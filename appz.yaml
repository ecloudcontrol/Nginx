    app:
        name: Nginx
        code: NGINX
        notify: appzdev@cloudbourne.co
        
    build:
        version: 1.28
        env: PROD
        build_file: none
        output_files: output/*.zip
        image_template: nginx-1.28
        
    deploy:
        context: tipreprod/PROD
        replicas: 1
        port:
        - 443
        - 80
        - 8080
    
    properties:
        SITE_PRIVATE_KEY:
          vault: SITE_PRIVATE_KEY
        SITE_CERT:
          vault: SITE_CERT
        revision : 1
