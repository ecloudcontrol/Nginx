    app:
        name: Nginx
        code: NGINX
        notify: appzdev@cloudbourne.co
        
    build:
        version: 1.26
        env: PROD
        build_file: none
        output_files: output/*.zip
        image_template: nginx-1.26
        
    deploy:
        context: tipreprod/PROD
        replicas: 1
        port:
        - 80
        - 8080
    volumes:
      - claim: nginx-auth
        class: linode-block-storage
        mount: /etc/nginx/auth
        name: auth
        size: 5Gi
        matchLabels: false
    
    properties:
        STATS_HTPASSWD:
          vault: STATS_HTPASSWD
        MIKE:
          vault: MIKE_USER
        revision : 8
        
