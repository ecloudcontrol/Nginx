        context: tipreprod/PROD
        replicas: 1
        port:
        - 80
        - 8080
    
    properties:
        STATS_HTPASSWD:
          vault: STATS_HTPASSWD
        MIKE:
          vault: MIKE_USER
        revision : 14
        
