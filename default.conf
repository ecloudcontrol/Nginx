# =================================================
# SECURE SERVICE — test-secure.lowtouchcloud.io
# =================================================
server {
    listen 80;
    listen [::]:80;
    server_name test-secure.lowtouchcloud.io;
    client_max_body_size 50M;
    # -------------------------------------------------
    # Proxy headers
    # -------------------------------------------------
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Ssl on;
    # -------------------------------------------------
    # Logs (critical for ALB / VPN debugging)
    # -------------------------------------------------
    access_log /var/log/nginx/test-secure.access.log;
    error_log /var/log/nginx/test-secure.error.log;
    # -------------------------------------------------
    # ALLOWED PATHS
    # -------------------------------------------------
    # Apache stats (currently working via NodePort)
    location ^~ /stats/ {

    auth_basic "Restricted Stats Access";
    auth_basic_user_file /etc/nginx/auth/stats.htpasswd;

        proxy_pass http://apache-test-1-0:8080;
}
    # HttpsWebProxy / ReadMP.php
    location ^~ /proxy/ {
        proxy_pass http://apache-test-1-1:80;
    }
    # -------------------------------------------------
    # DEFAULT to secweb
    # -------------------------------------------------
    location / {
        proxy_pass http://apache-test-1-0:8080;
    }
}
