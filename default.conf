# -------------------------------------------------
# Default server – block unknown hostnames
# -------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
# -------------------------------------------------
# Main site
# -------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name test-www.lowtouchcloud.io;
    client_max_body_size 100M;
    # -------------------------------------------------
    # GLOBAL proxy headers (CRITICAL FIX)
    # -------------------------------------------------
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Ssl on;
    # -------------------------------------------------
    # Security Headers
    # -------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # AUTO-FIX mixed content (IMPORTANT)
    add_header Content-Security-Policy "upgrade-insecure-requests" always;
    # -------------------------------------------------
    # DEFAULT → Apache
    # -------------------------------------------------
    location / {
        proxy_pass http://apache-test-1-0:80;
    }
    # -------------------------------------------------
    # Apache routes
    # -------------------------------------------------
    location ~* ^/AccountManagement {
        proxy_pass http://apache-test-1-0:80;
    }
    location ~ ^/(promos|referral\.html|holly_gifs|home/phil) {
        proxy_pass http://apache-test-1-0:80;
    }
    # -------------------------------------------------
    # Apache → FEATURES
    # -------------------------------------------------
    location ^~ /features/paper-trading { proxy_pass http://apache-test-1-0:80; }
    location ^~ /features/stock-races { proxy_pass http://apache-test-1-0:80; }
    location ^~ /features/ai-signals { proxy_pass http://apache-test-1-0:80; }
    location ^~ /features/inflection-data.html { proxy_pass http://apache-test-1-0:80; }
    location ^~ /features/gonogo { proxy_pass http://apache-test-1-0:80; }
    location ^~ /features/why { proxy_pass http://apache-test-1-0:80; }
    location ^~ /features/tradewave { proxy_pass http://apache-test-1-0:80; }
    location ^~ /features/money-machine { proxy_pass http://apache-test-1-0:80; }
    location ^~ /features/backtesting { proxy_pass http://apache-test-1-0:80; }
    location ^~ /features/pip-charting-idea-surfing { proxy_pass http://apache-test-1-0:80; }
    location ^~ /features/formula-editor { proxy_pass http://apache-test-1-0:80; }
    location ^~ /features/data-technology { proxy_pass http://apache-test-1-0:80; }
    location ^~ /features/ { proxy_pass http://apache-test-1-0:80/features/; }
    # -------------------------------------------------
    # Apache → Education
    # -------------------------------------------------
    location ^~ /education/ {
        proxy_pass http://apache-test-1-0:80;
    }
    # -------------------------------------------------
    # WordPress ROUTES
    # -------------------------------------------------
    location ^~ /holly { proxy_pass http://wordpress-6-3:80; }
    location ^~ /hollysummit { proxy_pass http://wordpress-6-3:80; }
    location ^~ /home { proxy_pass http://wordpress-6-3:80; }
    location ^~ /ibkr { proxy_pass http://wordpress-6-3:80; }
    location ^~ /upgrade { proxy_pass http://wordpress-6-3:80; }
    location ^~ /w365 { proxy_pass http://wordpress-6-3:80; }
    location ^~ /wealth { proxy_pass http://wordpress-6-3:80; }
    location ^~ /web { proxy_pass http://wordpress-6-3:80; }
    location ^~ /guide { proxy_pass http://wordpress-6-3:80; }
    location ^~ /media { proxy_pass http://wordpress-6-3:80; }
    location ^~ /user-guide {
        proxy_pass http://wordpress-6-3:80/user-guide;
    }
    location ^~ /blog {
        proxy_pass http://wordpress-6-3:80;
    }
    location ^~ /testimonials {
        proxy_pass http://wordpress-6-3:80;
        add_header Access-Control-Allow-Origin "https://test-www.lowtouchcloud.io" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }
    # -------------------------------------------------
    # WordPress LOGIN
    # -------------------------------------------------
    location = /wp-login.php {
        proxy_pass http://wordpress-6-3:80/wp-login.php;
    }
    # -------------------------------------------------
    # WordPress ADMIN
    # -------------------------------------------------
    location ^~ /wp-admin/ {
        proxy_pass http://wordpress-6-3:80/wp-admin/;
    }
    # -------------------------------------------------
    # WordPress CORE FILES
    # -------------------------------------------------
    location ~* ^/(wp-content|wp-includes)/ {
        proxy_pass http://wordpress-6-3:80;
        add_header Access-Control-Allow-Origin "https://test-www.lowtouchcloud.io" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }
    # -------------------------------------------------
    # WordPress REST API (for dynamic testimonials if used)
    # -------------------------------------------------
    location ^~ /wp-json/ {
        proxy_pass http://wordpress-6-3:80;
        add_header Access-Control-Allow-Origin "https://test-www.lowtouchcloud.io" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }
    # -------------------------------------------------
    # WordPress AJAX (common for plugins loading dynamic content)
    # -------------------------------------------------
    location = /wp-admin/admin-ajax.php {
        proxy_pass http://wordpress-6-3:80/wp-admin/admin-ajax.php;
        add_header Access-Control-Allow-Origin "https://test-www.lowtouchcloud.io" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
