# Default server to block unmatched requests (e.g., IP-based access)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;  # Matches any request not handled by other server blocks
    return 444;  # NGINX-specific code to close the connection
}

# Main server block for test-tradeideas.lowtouchcloud.io
server {
    listen 80;
    listen [::]:80;
    server_name test-tradeideas.lowtouchcloud.io;
    client_max_body_size 100M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Apache Test Service
    location /stats {
        proxy_pass http://apache-test-1-0/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WordPress Service
    location /wordpress {
        proxy_pass http://wordpress-6-3/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
